<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>면접 스크립트 페이서 & 타이머</title>
    <style>
        :root {
            --bg: #f8fafc;
            --card: #1e293b;
            --text: #f8fafc;
            --muted: #1e293b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --highlight: #f59e0b;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 30px 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 650px; }
        header { text-align: center; margin-bottom: 20px; }
        header h1 { font-size: 1.6rem; margin-bottom: 6px; }
        header p { color: var(--muted); font-size: 0.9rem; }
        .card { background: var(--card); border-radius: 16px; padding: 20px; border: 1px solid var(--border); margin-bottom: 20px; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 5px; }
        input { width: 100%; background: var(--bg); border: 1px solid var(--border); padding: 10px; border-radius: 8px; color: var(--text); outline: none; }
        textarea { width: 100%; height: 180px; background: var(--bg); border: 1px solid var(--border); padding: 12px; border-radius: 8px; color: var(--text); resize: vertical; margin-bottom: 15px; line-height: 1.6; }
        .btn-group { display: flex; gap: 10px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-secondary { background: var(--border); color: var(--text); }
        .timer-display { text-align: center; font-size: 2.5rem; font-weight: bold; color: var(--accent); margin: 15px 0; }
        .script-reader { line-height: 1.8; font-size: 1.1rem; white-space: pre-wrap; background: var(--bg); padding: 15px; border-radius: 8px; border: 1px solid var(--border); min-height: 120px; }
        .word { transition: background 0.2s, color 0.2s; padding: 2px 0; }
        .word.active { background: var(--highlight); color: #000; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>면접 스크립트 페이서</h1>
            <p>목표 시간에 맞춰 답변 페이스를 조절하는 연습 도구</p>
        </header>

        <div class="card">
            <div class="controls">
                <div>
                    <label>목표 시간 (초)</label>
                    <input type="number" id="targetSec" value="60" min="10">
                </div>
                <div>
                    <label>예상 필요 분당 단어 수</label>
                    <input type="text" id="wpmDisplay" value="0 WPM" readonly>
                </div>
            </div>
            <textarea id="scriptInput" placeholder="면접 답변 스크립트를 여기에 입력하세요..."></textarea>
            <div class="btn-group">
                <button class="btn-primary" id="startBtn">리딩 시작</button>
                <button class="btn-secondary" id="resetBtn">초기화</button>
            </div>
        </div>

        <div class="card">
            <div class="timer-display" id="timer">00:00</div>
            <div class="script-reader" id="reader">스크립트를 입력하고 시작을 누르면 페이서가 작동합니다.</div>
        </div>
    </div>

    <script>
        const scriptInput = document.getElementById('scriptInput');
        const targetSec = document.getElementById('targetSec');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const timer = document.getElementById('timer');
        const reader = document.getElementById('reader');
        const wpmDisplay = document.getElementById('wpmDisplay');

        let interval = null;
        let words = [];
        let currentIndex = 0;

        function updateWPM() {
            const text = scriptInput.value.trim();
            const wordCount = text ? text.split(/\s+/).length : 0;
            const sec = parseInt(targetSec.value) || 1;
            const wpm = Math.round((wordCount / sec) * 60);
            wpmDisplay.value = `${wpm} WPM (${wordCount}단어)`;
        }

        scriptInput.addEventListener('input', updateWPM);
        targetSec.addEventListener('input', updateWPM);

        startBtn.addEventListener('click', () => {
            if (interval) clearInterval(interval);
            const text = scriptInput.value.trim();
            if (!text) return;

            words = text.split(/(\s+)/);
            reader.innerHTML = '';
            
            let wordIdx = 0;
            words.forEach((chunk) => {
                const span = document.createElement('span');
                if (/\s+/.test(chunk)) {
                    span.textContent = chunk;
                } else {
                    span.textContent = chunk;
                    span.className = 'word';
                    span.dataset.index = wordIdx++;
                }
                reader.appendChild(span);
            });

            const totalWords = wordIdx;
            const totalMs = (parseInt(targetSec.value) || 60) * 1000;
            const msPerWord = totalMs / (totalWords || 1);

            let startTime = Date.now();
            currentIndex = 0;

            interval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const remainingSec = Math.max(0, Math.ceil((totalMs - elapsed) / 1000));
                
                const m = String(Math.floor(remainingSec / 60)).padStart(2, '0');
                const s = String(remainingSec % 60).padStart(2, '0');
                timer.textContent = `${m}:${s}`;

                const nextIndex = Math.floor(elapsed / msPerWord);
                if (nextIndex !== currentIndex && nextIndex < totalWords) {
                    const prevWord = reader.querySelector(`.word[data-index="${currentIndex}"]`);
                    if (prevWord) prevWord.classList.remove('active');

                    currentIndex = nextIndex;
                    const curWord = reader.querySelector(`.word[data-index="${currentIndex}"]`);
                    if (curWord) curWord.classList.add('active');
                }

                if (elapsed >= totalMs) {
                    clearInterval(interval);
                    timer.textContent = "00:00";
                }
            }, 50);
        });

        resetBtn.addEventListener('click', () => {
            if (interval) clearInterval(interval);
            timer.textContent = "00:00";
            reader.textContent = "스크립트를 입력하고 시작을 누르면 페이서가 작동합니다.";
        });
    </script>
</body>
</html>
